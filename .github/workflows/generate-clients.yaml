name: Generate Clients

on:
  push:
    branches: [mainline]
    paths:
      - 'openapi/**'
      - '.github/workflows/generate-clients.yaml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openapi-python-client>=0.19.0

      - name: Generate clients
        run: ./scripts/generate-clients.sh

      - name: Commit generated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/aphex_clients/generated/
          git diff --staged --quiet || git commit -m "chore: regenerate clients from OpenAPI specs"
          git push
